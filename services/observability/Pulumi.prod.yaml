config:
  observability:config:
    kubeconfig:
      ref: op://Homelab/Kubeconfig prod/password
    zone: 4jp.de
    loki:
      # renovate: datasource=helm registryUrl=https://grafana-community.github.io/helm-charts packageName=loki versioning=helm
      version: 18.15.1
      retention-days: 30
      storage-size-gb: 10
    mimir:
      # renovate: datasource=helm registryUrl=https://grafana.github.io/helm-charts packageName=mimir-distributed versioning=helm
      version: 6.2.1
      # Long enough for the backfill of the legacy Prometheus history (oldest block 2025-10-10, ADR-0023).
      # The mimir-metrics bucket is not part of the HBS 3 off-site job, so this history has no off-site copy.
      retention-days: 400
      endpoint: qnap.4jp.de:8443
      bucket: mimir-metrics
      access-key-id:
        ref: op://Homelab/QuObjects Mimir Metrics/username
      secret-access-key:
        ref: op://Homelab/QuObjects Mimir Metrics/password
      ingester-storage-size-gb: 10
      max-global-series-per-user: 250000
      store-gateway-storage-size-gb: 5
      compactor-storage-size-gb: 10
    alloy:
      # renovate: datasource=helm registryUrl=https://grafana.github.io/helm-charts packageName=alloy versioning=helm
      version: 1.13.1
      syslog:
        # QNAP (QuLog Center, Log Sender, Send to Syslog Server) sends to syslog.4jp.de, which
        # resolves to this fixed MetalLB address. RFC 5424 arrives on port 1514, RFC 3164 on 1515,
        # each over TCP and UDP. OPNsense sends RFC 5424 to port 1516 (ADR-0038). Only the QNAP's
        # two NICs and OPNsense may send (ADR-0024).
        host: syslog
        address: 10.10.88.2
        allowed-sources:
          - 10.10.0.10/32
          - 10.10.0.6/32
          - 10.10.0.1/32  # OPNsense, CoRE interface (ADR-0038)
      # Secure Note with one `<group> <target>` line per probe or scrape target (kept out of the
      # repository on purpose, see targets.py), and the credentials of the scraped endpoints.
      targets:
        ref: op://Homelab/Monitoring Targets/note_value
      ax51:
        username:
          ref: op://Homelab/Prometheus AX51 Scrape/username
        password:
          ref: op://Homelab/Prometheus AX51 Scrape/password
      pretix:
        username:
          ref: op://Homelab/Prometheus Pretix Scrape/username
        password:
          ref: op://Homelab/Prometheus Pretix Scrape/password
      # Tandoor 2.7.1 serves /metrics only to a signed-in user (ADR-0035).
      tandoor-session:
        ref: op://Homelab/Tandoor Metrics Scrape/password
    grafana:
      # renovate: datasource=helm registryUrl=https://grafana-community.github.io/helm-charts packageName=grafana versioning=helm
      version: 13.5.1
      host: g
      storage-size-gb: 2
      # renovate: datasource=github-releases packageName=grafana/grafana-opensearch-datasource versioning=semver
      opensearch-plugin-version: 2.34.5
      pushover:
        # username holds the Pushover user key, password the application API token
        user-key:
          ref: op://Homelab/Pushover Grafana/username
        api-token:
          ref: op://Homelab/Pushover Grafana/password
    kube-state-metrics:
      # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts packageName=kube-state-metrics versioning=helm
      version: 8.6.0
    node-exporter:
      # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts packageName=prometheus-node-exporter versioning=helm
      version: 4.59.0
    speedtest-exporter:
      # renovate: datasource=github-releases packageName=billimek/prometheus-speedtest-exporter versioning=semver
      version: 1.3.1
    opnsense:
      # renovate: datasource=docker packageName=ghcr.io/athennamind/opnsense-exporter versioning=semver
      version: 0.0.19
      api-host: router.4jp.de
      node-exporter-target: 10.10.0.1:9100
      api-key:
        ref: op://Homelab/OPNsense Metrics Exporter/username
      api-secret:
        ref: op://Homelab/OPNsense Metrics Exporter/password
