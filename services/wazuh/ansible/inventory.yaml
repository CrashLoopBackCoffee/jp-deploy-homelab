all:
  children:
    k0s_nodes:
      vars:
        ansible_user: k0sctl
        wazuh_agent_group: k0s-nodes
      hosts:
        k0s0:
          ansible_host: 10.10.8.1
    docker_hosts:
      vars:
        ansible_user: root
        wazuh_agent_group: docker-hosts
      hosts:
        ax51:
          # SSH alias from ~/.ssh/config.d; the host reaches the manager through the `ax51-wazuh` tunnel
          ansible_host: AX51
