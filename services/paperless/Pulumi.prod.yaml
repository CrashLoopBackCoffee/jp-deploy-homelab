config:
  paperless:config:
    kubeconfig:
      ref: op://Homelab/Kubeconfig prod/password
    zone: 4jp.de
    paperless:
      # renovate: datasource=github-releases packageName=paperless-ngx/paperless-ngx versioning=semver
      version: 3.3.1
      host: paperless
      ocr-language: deu+eng
      consume:
        # QNAP (qnap.4jp.de resolves to 10.10.0.10); the share and its NFS export for k0s0 are
        # created on the NAS, outside Pulumi.
        server: qnap.4jp.de
        share: /paperless-consume
      storage:
        data-size: 5Gi
        media-size: 30Gi
        export-size: 30Gi
    database:
      name: paperless-db
      # renovate: datasource=docker packageName=ghcr.io/cloudnative-pg/postgresql versioning=semver
      image-version: "17.10"
      storage-size: 5Gi
      backup:
        endpoint: https://qnap.4jp.de:8443
        bucket: cnpg-backups
        access-key-id:
          ref: op://Homelab/QuObjects CNPG Backup/username
        secret-access-key:
          ref: op://Homelab/QuObjects CNPG Backup/password
        schedule: "0 0 3 * * *"
        retention-policy: 14d
    backup:
      # renovate: datasource=docker packageName=ghcr.io/crashloopbackcoffee/restic-rclone versioning=docker
      restic-rclone-version: 0.18.0-1.70.3
      # renovate: datasource=github-releases packageName=kubernetes/kubernetes versioning=semver
      kubectl-version: 1.34.1
      repository-path: paperless
      schedule: "0 2 * * *"
      retention-daily: 7
      retention-weekly: 4
      retention-monthly: 6
      restic-password:
        ref: op://Homelab/Paperless Backup/password
      nextcloud:
        # Item `Nextcloud Paperless Backup`: the website (url) is the base URL, username the account,
        # and the custom field `app-password` an app password created in Nextcloud (Settings,
        # Security). The item's `password` is the account password, which WebDAV rejects.
        url:
          ref: op://Homelab/Nextcloud Paperless Backup/url
        username:
          ref: op://Homelab/Nextcloud Paperless Backup/username
        password:
          ref: op://Homelab/Nextcloud Paperless Backup/app-password
    redis:
      # renovate: datasource=github-releases packageName=redis/redis versioning=semver
      version: 8.2.2
    tika:
      # renovate: datasource=docker packageName=registry-1.docker.io/apache/tika versioning=loose
      version: 3.2.3.0
    gotenberg:
      # renovate: datasource=github-releases packageName=gotenberg/gotenberg versioning=semver
      version: 8.24.0
