config:
  kubernetes:config:
    cert-manager:
      # renovate: datasource=github-releases packageName=cert-manager/cert-manager versioning=semver
      version: v1.21.3
      use-staging: false
      acme-email: support@jaypee.solutions
    cloudnative-pg:
      # renovate: datasource=github-releases packageName=cloudnative-pg/charts versioning=semver
      version: 0.29.1
      plugin-version: 0.8.1
      cluster:
        name: postgres-pilot
        # renovate: datasource=docker packageName=ghcr.io/cloudnative-pg/postgresql versioning=semver
        image-version: "17.10"
        storage-size: 2Gi
      backup:
        endpoint: https://qnap.4jp.de:8443
        bucket: cnpg-backups
        access-key-id:
          ref: op://Homelab/QuObjects CNPG Backup/username
        secret-access-key:
          ref: op://Homelab/QuObjects CNPG Backup/password
        # 21:00 UTC all year, one hour before the QNAP's 23:00-local snapshot in winter (ADR-0022).
        schedule: "0 0 21 * * *"
        retention-policy: 14d
    cloudflare:
      api-token:
        ref: op://Homelab/Cloudflare [4jp.de]/password
      zone: 4jp.de
    csi-nfs-driver:
      # renovate: datasource=github-releases packageName=kubernetes-csi/csi-driver-nfs versioning=semver
      version: v4.13.6
    kubeconfig:
      ref: op://Homelab/Kubeconfig prod/password
    longhorn:
      # renovate: datasource=github-releases packageName=longhorn/longhorn versioning=semver
      version: 1.13.0
      # Mount point of the Kingston NVMe, prepared by services/k0s/ansible/prepare-longhorn-storage.yaml
      data-path: /var/lib/longhorn
      # Phase 1 has a single node, so a replica count above 1 would leave every volume degraded
      replica-count: 1
      backup:
        endpoint: https://qnap.4jp.de:8443
        bucket: longhorn-backups
        region: us-east-1
        access-key-id:
          ref: op://Homelab/QuObjects Longhorn Backup/username
        secret-access-key:
          ref: op://Homelab/QuObjects Longhorn Backup/password
    mariadb-operator:
      # renovate: datasource=github-releases packageName=mariadb-operator/mariadb-operator versioning=semver
      version: 26.10.2
    trivy-operator:
      # renovate: datasource=helm registryUrl=https://aquasecurity.github.io/helm-charts packageName=trivy-operator versioning=helm
      version: 0.37.0
      # renovate: datasource=docker packageName=aquasecurity/trivy versioning=semver
      trivy-image-version: 0.75.0
    metallb:
      # renovate: datasource=github-releases packageName=metallb/metallb versioning=semver
      version: 0.16.1
      start: 10.10.88.1
      end: 10.10.88.250
    openebs-lvm:
      # renovate: datasource=github-releases packageName=openebs/lvm-localpv versioning=semver
      version: 1.10.1
      volume-group: postgres
    traefik:
      # renovate: datasource=github-releases packageName=traefik/traefik versioning=semver
      version: v34.3.0
