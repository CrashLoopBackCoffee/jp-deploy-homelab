config:
  tandoor:config:
    kubeconfig:
      ref: op://Homelab/Kubeconfig prod/password
    zone: 4jp.de
    tandoor:
      # renovate: datasource=github-releases packageName=TandoorRecipes/recipes versioning=semver
      version: 2.6.15
      host: tandoor
      media-size: 10Gi
      # Non-secret preferences of the legacy instance (`FRACTION_PREF_DEFAULT`,
      # `COMMENT_PREF_DEFAULT`, `SHOPPING_MIN_AUTOSYNC_INTERVAL`, `ENABLE_PDF_EXPORT`, ...) go here.
      settings: {}
    database:
      name: tandoor-db
      # renovate: datasource=docker packageName=ghcr.io/cloudnative-pg/postgresql versioning=semver
      image-version: "17.10"
      storage-size: 2Gi
      backup:
        endpoint: https://qnap.4jp.de:8443
        bucket: cnpg-backups
        access-key-id:
          ref: op://Homelab/QuObjects CNPG Backup/username
        secret-access-key:
          ref: op://Homelab/QuObjects CNPG Backup/password
        # 21:00 UTC is 23:00 CEST; use "0 0 22 * * *" after DST ends to keep 23:00 local.
        # Clear of the QNAP's HBS sync window (see ADR-0022).
        schedule: "0 0 21 * * *"
        retention-policy: 14d
    backup:
      # renovate: datasource=docker packageName=ghcr.io/crashloopbackcoffee/restic-rclone versioning=docker
      restic-rclone-version: 0.18.0-1.70.3
      repository-path: tandoor
      # 01:30 UTC, after the CloudNativePG backup at 21:00 and before the QNAP's 03:00 task
      schedule: "30 1 * * *"
      retention-daily: 7
      retention-weekly: 4
      retention-monthly: 6
      restic-password:
        ref: op://Homelab/Tandoor Backup/password
      nextcloud:
        # The same Nextcloud account and app password as the Paperless backup; the repository is a
        # separate folder with its own restic password.
        url:
          ref: op://Homelab/Nextcloud Paperless Backup/url
        username:
          ref: op://Homelab/Nextcloud Paperless Backup/username
        password:
          ref: op://Homelab/Nextcloud Paperless Backup/app-password
