[project]
name = "homelab"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Fixed pulumi deps for global pinning
    "pulumi-cloudflare==6.10.0",
    "pulumi-command==1.1.3",
    "pulumi-docker==4.9.0",
    "pulumi-kubernetes==4.23.0",
    "pulumi-onepassword==1.1.3",
    "pulumi-random==4.18.4",
    "pulumi==3.203.0",

    # Workspaces
    "backup",
    "iot",
    "kubernetes",
    "monitoring",
    "n8n",
    "paperless",
]

[dependency-groups]
dev = [
    "distlib>=0.3.9",
    "filelock>=3.16.1",
    "platformdirs>=4.3.6",
    "pre-commit>=4.0.1",
    "pyright>=1.1.390",
    "ruff>=0.8.2",
    "yamllint>=1.35.1",
]

[tool.uv.sources]
backup = { workspace = true }
iot = { workspace = true }
kubernetes = { workspace = true }
monitoring = { workspace = true }
n8n = { workspace = true }
paperless = { workspace = true }
utils = { workspace = true }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "utils"]
exclude = ["services/k0s"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/examples"]
extend-include = ["scripts/generate-config-schema"]

[tool.ruff.lint]
extend-select = [
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "ERA",    # flake8-eradicate (commented out code)
    "G",      # flake8-logging-format
    "I",      # isort
    "ISC",    # flake8-implicit-str-concat
    "PL",     # Pylint
    "RET",    # flake8-return
    "RUF100", # unused noqa
    "SLF",    # flake8-self
]
ignore = [
    "ISC001",  # single line string concat
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
    "PLR1711", # useless return
]

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "SLF001", # allow access to private members in tests
]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
deprecateTypingAliases = true
useLibraryCodeForTypes = true
include = ["scripts", "services", "utils", "*.py"]
exclude = [
    "__pycache__",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "docs/examples",
    "node_modules",
    "venv",
]
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
venvPath = "."

[tool.config-models.backup]
root = "services/backup"
model = "backup.config:PulumiConfigRoot"

[tool.config-models.iot]
root = "services/iot"
model = "iot.config:PulumiConfigRoot"

[tool.config-models.kubernetes]
root = "services/kubernetes"
model = "kubernetes.config:PulumiConfigRoot"

[tool.config-models.monitoring]
root = "services/monitoring"
model = "monitoring.config:PulumiConfigRoot"

[tool.config-models.n8n]
root = "services/n8n"
model = "n8n.config:PulumiConfigRoot"

[tool.config-models.paperless]
root = "services/paperless"
model = "paperless.config:PulumiConfigRoot"
